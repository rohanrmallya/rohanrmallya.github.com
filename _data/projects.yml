# Projects data source
# Each entry supports:
#   - num: Card number (e.g. "01")
#   - name: Project title
#   - slug: URL slug (maps to /projects/<slug>/ and _projects/<slug>.md)
#   - description: Brief description of the project
#   - image: Path to project image / screenshot / logo (SVG, PNG, WebP)
#   - image_fit: "cover" (default, perfect for screenshots/banners) or "contain" (for logos/icons)
#   - logo: (Optional fallback for image)
#   - version: Current project version (e.g. "v1.2.0")
#   - last_updated: Human-readable or ISO date (e.g. "July 2026" or "2026-07-19")
#   - live_url: (Optional) URL for the "Watch it Live" button
#   - github_url: (Optional) URL for the "Github" button

